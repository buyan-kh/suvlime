# XcodeGen spec. Run `xcodegen generate` from this directory to create SuppsAI.xcodeproj.
name: SuppsAI
options:
  bundleIdPrefix: com.suvlime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SuppsAI:
    type: application
    platform: iOS
    sources:
      - path: SuppsAI
        excludes:
          - "**/.DS_Store"
    resources:
      - SuppsAI/Resources/Assets.xcassets
      - SuppsAI/Preview Content/Preview Assets.xcassets
    info:
      path: SuppsAI/Resources/Info.plist
      properties:
        CFBundleDisplayName: SuppsAI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.suvlime.suppsai
            CFBundleURLSchemes:
              - suppsai
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "SuppsAI uses notifications to remind you when a scheduled dose or supplement is due."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suvlime.suppsai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"SuppsAI/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  SuppsAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuppsAITests
    dependencies:
      - target: SuppsAI
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SuppsAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SuppsAI
