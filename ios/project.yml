# XcodeGen spec — run `xcodegen generate` from this directory to produce PepTracker.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: PepTracker
options:
  bundleIdPrefix: com.suvlime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PepTracker:
    type: application
    platform: iOS
    sources:
      - path: PepTracker
        excludes:
          - "**/.DS_Store"
    resources:
      - PepTracker/Resources/Assets.xcassets
      - PepTracker/Preview Content/Preview Assets.xcassets
    info:
      path: PepTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: PepTracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "PepTracker uses notifications to remind you when a scheduled dose is due."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suvlime.peptracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"PepTracker/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  PepTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PepTrackerTests
    dependencies:
      - target: PepTracker
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PepTracker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PepTracker
